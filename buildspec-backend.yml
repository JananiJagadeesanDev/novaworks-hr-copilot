version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URL
  build:
    commands:
      - echo Building backend image...
      - docker build -t novaworks-backend ./backend
      - docker tag novaworks-backend:latest $ECR_URL/novaworks-backend:latest
  post_build:
    commands:
      - echo Pushing backend image...
      - docker push $ECR_URL/novaworks-backend:latest
      - echo Backend build complete.
