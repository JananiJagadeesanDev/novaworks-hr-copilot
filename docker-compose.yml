services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novaworks-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/novaworks.db:/app/novaworks.db
      - ./backend/qdrant_data:/app/qdrant_data
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./novaworks.db
      - QDRANT_PATH=./qdrant_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novaworks-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
